<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#071324" />
    </linearGradient>
    <linearGradient id="pawnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="4" />

  <!-- Chess Pawn (Pedone Algebrico Gambito) with Glow -->
  <g filter="url(#glow)" transform="translate(0, 10)">
    <!-- Testa del pedone (cerchio superiore) -->
    <circle cx="256" cy="155" r="58" fill="url(#pawnGrad)" />

    <!-- Collare -->
    <ellipse cx="256" cy="225" rx="64" ry="16" fill="url(#pawnGrad)" />

    <!-- Corpo del pedone -->
    <path d="M 216 235 C 216 285 190 320 180 370 L 332 370 C 322 320 296 285 296 235 Z" fill="url(#pawnGrad)" />

    <!-- Anello intermedio -->
    <rect x="170" y="365" width="172" height="20" rx="8" fill="url(#pawnGrad)" />

    <!-- Base del pedone -->
    <path d="M 150 420 L 160 385 L 352 385 L 362 420 Z" fill="url(#pawnGrad)" />
    <rect x="136" y="415" width="240" height="26" rx="10" fill="url(#pawnGrad)" />

    <!-- Simbolo Algebrico 'x' al centro della testa del pedone -->
    <text x="256" y="172" font-family="sans-serif" font-size="52" font-weight="900" fill="#0a0f1d" text-anchor="middle">x</text>
  </g>
</svg>